org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.daemon=false
android.useAndroidX=true
android.nonTransitiveRClass=true
# 缺少 SDK 组件时让 Gradle 自动下载（配合 CI 里已接受的 licenses）
android.builder.sdkDownload=true
kotlin.code.style=official

# api.php 的完整地址（不要带末尾斜杠）
API_BASE=https://xfan.ccccocccc.cc/api.php

# 上传接口令牌（必须与 server/api.php 里的 $CFG['token'] 一致）
UPLOAD_TOKEN=change-me-please

# 更新源 GitHub 仓库坐标
# App 会拼出 raw.githubusercontent.com + jsDelivr + 多个代理镜像依次尝试
UPDATE_OWNER=gjgffugf
UPDATE_REPO=update
UPDATE_BRANCH=main
UPDATE_FILE=videoupdate.json
